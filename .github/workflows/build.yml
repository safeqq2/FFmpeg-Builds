name: build-mini-ffmpeg-rtmp
on:
  push:
    branches: [ main ]
  workflow_dispatch: # 支持手动点按钮触发编译

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: install mingw cross compiler
      run: |
        sudo apt update
        sudo apt install -y mingw-w64 yasm nasm pkg-config git

    - name: download ffmpeg source
      run: |
        git clone https://git.ffmpeg.org/ffmpeg.git ffmpeg
        cd ffmpeg

    - name: configure minimal rtmp push only
      run: |
        cd ffmpeg
        ./configure \
        --target-os=mingw32 \
        --arch=x86_64 \
        --cross-prefix=x86_64-w64-mingw32- \
        --enable-cross-compile \
        --enable-gpl --enable-static \
        --disable-everything \
        --enable-ffmpeg \
        --disable-ffplay --disable-ffprobe \
        --disable-doc --disable-filters --disable-devices \
        --enable-encoder=libx264,aac \
        --enable-decoder=h264,aac \
        --enable-demuxer=mov,mp4,flv \
        --enable-muxer=flv \
        --enable-protocol=rtmp,file \
        --prefix=./install

    - name: compile
      run: |
        cd ffmpeg
        make -j$(nproc)
        make install

    - name: upload ffmpeg.exe
      uses: actions/upload-artifact@v4
      with:
        name: mini-ffmpeg-rtmp-win64
        path: ffmpeg/install/bin/ffmpeg.exe
